name: signals-refresh

# Prices are fetched on your Mac (Yahoo blocks GitHub's servers), so this workflow
# only records a Refresh request; the Mac agent picks it up within a minute.
on:
  workflow_dispatch:
    inputs:
      section:
        description: "intraday | long | overnight | score | all"
        default: "all"
        required: true

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: signals
      - name: Record refresh request
        run: |
          mkdir -p signals/data
          printf '{"requested_at":"%s","section":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.event.inputs.section || 'all' }}" > signals/data/refresh_request.json
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add signals/data/refresh_request.json
          git commit -m "signals: refresh requested"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
